<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="930" viewBox="0 0 1520 930"><rect width="1520" height="930" fill="#FAFAFA"/><text x="28" y="38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#18181B" font-weight="700" text-anchor="start">STK-005  /  RECUPERACIÓN</text><text x="1490" y="38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="500" text-anchor="end">PROPUESTA VISUAL · PENDIENTE DE APROBACIÓN</text><text x="30" y="63" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="600" text-anchor="start">Escritorio · ref. 1440 px</text><text x="1120" y="63" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="600" text-anchor="start">Móvil · 375 px</text><g transform="translate(20 76)"><rect x="0" y="0" width="1080" height="820" rx="14" fill="#FFFFFF" stroke="#E4E4E7"/><rect x="0" y="0" width="1080" height="64" rx="14" fill="#FFFFFF" stroke="none"/><line x1="0" y1="64" x2="1080" y2="64" stroke="#E4E4E7" stroke-width="1"/><text x="32" y="40" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#18181B" font-weight="700" text-anchor="start">Stockly</text><text x="596" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" fill="#18181B" font-weight="700" text-anchor="start">Recupera el acceso</text><text x="596" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#71717A" font-weight="400" text-anchor="start">Te enviaremos un enlace al correo asociado a tu cuenta.</text><text x="596" y="238" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="600" text-anchor="start">Correo electrónico</text><rect x="596" y="246" width="410" height="40" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/><text x="608" y="271" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#18181B" font-weight="400" text-anchor="start"></text><rect x="596" y="312" width="410" height="42" rx="8" fill="#F97316" stroke="#F97316"/><text x="801" y="338" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#18181B" font-weight="600" text-anchor="middle">Enviar enlace</text><text x="801" y="396" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="middle">Si la cuenta existe, recibirás instrucciones para recuperar el acceso.</text><text x="801" y="466" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="middle">El enlace vence en 30 minutos y solo se puede usar una vez.</text><text x="801" y="520" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#9A3412" font-weight="600" text-anchor="middle">Volver al ingreso</text></g><g transform="translate(1120 76)"><rect x="0" y="0" width="375" height="820" rx="24" fill="#FFFFFF" stroke="#E4E4E7"/><text x="24" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#18181B" font-weight="700" text-anchor="start">Stockly</text><text x="24" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" fill="#18181B" font-weight="700" text-anchor="start">Recupera el acceso</text><text x="24" y="145" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#71717A" font-weight="400" text-anchor="start">Escribe el correo asociado a tu cuenta.</text><text x="24" y="186" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="600" text-anchor="start">Correo electrónico</text><rect x="24" y="194" width="327" height="40" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/><text x="36" y="219" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#18181B" font-weight="400" text-anchor="start"></text><rect x="24" y="260" width="327" height="42" rx="8" fill="#F97316" stroke="#F97316"/><text x="187.5" y="286" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#18181B" font-weight="600" text-anchor="middle">Enviar enlace</text><rect x="24" y="338" width="327" height="122" rx="10" fill="#FFF7ED" stroke="#FED7AA"/><text x="42" y="369" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#18181B" font-weight="600" text-anchor="start">Revisa tu correo</text><text x="42" y="395" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">Si la cuenta existe, recibirás instrucciones.</text><text x="42" y="417" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">El enlace vence en 30 min y es de un uso.</text><text x="188" y="515" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#9A3412" font-weight="600" text-anchor="middle">Volver al ingreso</text></g></svg>