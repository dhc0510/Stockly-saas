<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="930" viewBox="0 0 1520 930"><rect width="1520" height="930" fill="#FAFAFA"/><text x="28" y="38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#18181B" font-weight="700" text-anchor="start">STK-005  /  CAMBIAR CONTRASEÑA</text><text x="1490" y="38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="500" text-anchor="end">PROPUESTA VISUAL · PENDIENTE DE APROBACIÓN</text><text x="30" y="63" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="600" text-anchor="start">Escritorio · ref. 1440 px</text><text x="1120" y="63" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="600" text-anchor="start">Móvil · 375 px</text><g transform="translate(20 76)"><rect x="0" y="0" width="1080" height="820" rx="14" fill="#FFFFFF" stroke="#E4E4E7"/><rect x="0" y="0" width="1080" height="64" rx="14" fill="#FFFFFF" stroke="none"/><line x1="0" y1="64" x2="1080" y2="64" stroke="#E4E4E7" stroke-width="1"/><text x="32" y="40" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#18181B" font-weight="700" text-anchor="start">Stockly</text><text x="596" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="#18181B" font-weight="700" text-anchor="start">Define una nueva contraseña</text><text x="596" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#71717A" font-weight="400" text-anchor="start">El enlace es válido por 30 minutos y solo se usa una vez.</text><text x="596" y="234" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="600" text-anchor="start">Nueva contraseña</text><rect x="596" y="242" width="410" height="40" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/><text x="608" y="267" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#18181B" font-weight="400" text-anchor="start"></text><text x=