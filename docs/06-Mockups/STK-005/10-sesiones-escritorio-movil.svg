<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="930" viewBox="0 0 1520 930"><rect width="1520" height="930" fill="#FAFAFA"/><text x="28" y="38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#18181B" font-weight="700" text-anchor="start">STK-005  /  SESIONES</text><text x="1490" y="38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="500" text-anchor="end">PROPUESTA VISUAL · PENDIENTE DE APROBACIÓN</text><text x="30" y="63" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="600" text-anchor="start">Escritorio · ref. 1440 px</text><text x="1120" y="63" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="600" text-anchor="start">Móvil · 375 px</text><g transform="translate(20 76)"><rect x="0" y="0" width="1080" height="820" rx="14" fill="#FFFFFF" stroke="#E4E4E7"/><rect x="0" y="0" width="224" height="820" rx="14" fill="#FAFAFA" stroke="#E4E4E7"/><text x="24" y="42" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#18181B" font-weight="700" text-anchor="start">Stockly</text><line x1="0" y1="64" x2="224" y2="64" stroke="#E4E4E7" stroke-width="1"/><text x="24" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="700" text-anchor="start">EMPRESA</text><text x="28" y="153" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#71717A" font-weight="400" text-anchor="start">Usuarios y roles</text><rect x="12" y="170" width="200" height="40" rx="8" fill="#FFF7ED" stroke="none"/><text x="28" y="196" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#9A3412" font-weight="600" text-anchor="start">Seguridad</text><rect x="224" y="0" width="856" height="64" rx="14" fill="#FFFFFF" stroke="none"/><line x1="224" y1="64" x2="1080" y2="64" stroke="#E4E4E7" stroke-width="1"/><text x="258" y="40" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#18181B" font-weight="600" text-anchor="start">Empresa La Esquina</text><text x="258" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" fill="#18181B" font-weight="700" text-anchor="start">Seguridad de sesiones</text><text x="258" y="140" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#71717A" font-weight="400" text-anchor="start">Define cuánto tiempo puede permanecer abierta una sesión.</text><rect x="258" y="177" width="790" height="236" rx="12" fill="#FFFFFF" stroke="#E4E4E7"/><text x="284" y="215" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#18181B" font-weight="600" text-anchor="start">Cierre por inactividad</text><text x="284" y="242" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#71717A" font-weight="400" text-anchor="start">Elige cada cuánto cerrar sesiones sin actividad.</text><rect x="284" y="265" width="20" height="20" rx="10" fill="#F97316" stroke="#F97316"/><circle cx="294" cy="275" r="4" fill="#FFFFFF"/><text x="318" y="280" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#18181B" font-weight="500" text-anchor="start">Cerrar después de</text><rect x="318" y="297" width="310" height="44" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/><text x="336" y="325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#18181B" font-weight="500" text-anchor="start">30 minutos</text><text x="607" y="325" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#71717A" font-weight="600" text-anchor="middle">⌄</text><text x="284" y="368" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">Intervalos de 30 minutos · sin máximo predefinido</text><line x1="284" y1="387" x2="1020" y2="387" stroke="#E4E4E7" stroke-width="1"/><rect x="284" y="394" width="20" height="20" rx="10" fill="#FFFFFF" stroke="#E4E4E7"/><text x="318" y="410" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#18181B" font-weight="500" text-anchor="start">Nunca cerrar automáticamente</text><rect x="258" y="433" width="790" height="142" rx="10" fill="#FFF7ED" stroke="#FED7AA"/><text x="282" y="465" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#18181B" font-weight="600" text-anchor="start">Sesión persistente</text><text x="282" y="491" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">Al seleccionar «Nunca», la sesión seguirá activa entre aperturas del navegador.</text><text x="282" y="513" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">No habrá vencimiento automático; cerrar sesión o revocar el acceso sí la termina.</text><rect x="282" y="530" width="152" height="26" rx="13" fill="#FFFFFF" stroke="none"/><text x="358" y="547" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#9A3412" font-weight="600" text-anchor="middle">Sin límite absoluto</text><rect x="258" y="595" width="790" height="130" rx="10" fill="#FFFFFF" stroke="#E4E4E7"/><text x="282" y="629" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#18181B" font-weight="600" text-anchor="start">Dispositivos recordados</text><text x="282" y="655" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">Pedir el código por correo al iniciar desde un dispositivo nuevo.</text><text x="282" y="685" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">Se recordará durante 30 días después de verificarlo.</text><rect x="838" y="754" width="210" height="42" rx="8" fill="#F97316" stroke="#F97316"/><text x="943" y="780" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#18181B" font-weight="600" text-anchor="middle">Guardar configuración</text></g><g transform="translate(1120 76)"><rect x="0" y="0" width="375" height="820" rx="24" fill="#FFFFFF" stroke="#E4E4E7"/><text x="24" y="47" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#18181B" font-weight="700" text-anchor="start">Stockly</text><text x="24" y="91" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#18181B" font-weight="700" text-anchor="start">Seguridad de sesiones</text><text x="24" y="119" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#71717A" font-weight="400" text-anchor="start">Configura el cierre por inactividad.</text><rect x="24" y="150" width="327" height="235" rx="12" fill="#FFFFFF" stroke="#E4E4E7"/><text x="42" y="181" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#18181B" font-weight="600" text-anchor="start">Cierre por inactividad</text><text x="42" y="205" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">Cada empresa puede elegir su intervalo.</text><rect x="42" y="229" width="18" height="18" rx="9" fill="#F97316" stroke="#F97316"/><circle cx="51" cy="238" r="3" fill="#FFFFFF"/><text x="70" y="243" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#18181B" font-weight="500" text-anchor="start">Cerrar después de</text><rect x="42" y="260" width="291" height="42" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/><text x="56" y="286" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#18181B" font-weight="500" text-anchor="start">30 minutos</text><text x="317" y="286" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#71717A" font-weight="600" text-anchor="middle">⌄</text><text x="42" y="326" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">Cada 30 min · sin máximo predefinido</text><rect x="42" y="346" width="18" height="18" rx="9" fill="#FFFFFF" stroke="#E4E4E7"/><text x="70" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#18181B" font-weight="500" text-anchor="start">Nunca cerrar automáticamente</text><rect x="24" y="402" width="327" height="156" rx="10" fill="#FFF7ED" stroke="#FED7AA"/><text x="42" y="432" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#18181B" font-weight="600" text-anchor="start">Sesión persistente</text><text x="42" y="458" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">«Nunca» mantiene la sesión entre aperturas</text><text x="42" y="477" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">del navegador y no establece vencimiento</text><text x="42" y="496" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">automático. Cerrar sesión o revocar acceso</text><text x="42" y="515" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">sí la termina.</text><rect x="24" y="575" width="327" height="122" rx="10" fill="#FFFFFF" stroke="#E4E4E7"/><text x="42" y="606" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#18181B" font-weight="600" text-anchor="start">Dispositivos recordados</text><text x="42" y="631" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">Código por correo para nuevos dispositivos.</text><text x="42" y="653" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">Recordar durante 30 días.</text><rect x="24" y="720" width="327" height="42" rx="8" fill="#F97316" stroke="#F97316"/><text x="187.5" y="746" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#18181B" font-weight="600" text-anchor="middle">Guardar configuración</text></g></svg>