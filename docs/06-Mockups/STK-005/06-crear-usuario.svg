<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="930" viewBox="0 0 1520 930"><rect width="1520" height="930" fill="#FAFAFA"/><text x="28" y="38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#18181B" font-weight="700" text-anchor="start">STK-005  /  CREAR USUARIO</text><text x="1490" y="38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="500" text-anchor="end">PROPUESTA VISUAL · PENDIENTE DE APROBACIÓN</text><text x="30" y="63" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="600" text-anchor="start">Escritorio · ref. 1440 px</text><text x="1120" y="63" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="600" text-anchor="start">Móvil · 375 px</text><g transform="translate(20 76)"><rect x="0" y="0" width="1080" height="820" rx="14" fill="#FFFFFF" stroke="#E4E4E7"/><rect x="0" y="0" width="224" height="820" rx="14" fill="#FAFAFA" stroke="#E4E4E7"/><text x="24" y="42" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#18181B" font-weight="700" text-anchor="start">Stockly</text><line x1="0" y1="64" x2="224" y2="64" stroke="#E4E4E7" stroke-width="1"/><text x="24" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="700" text-anchor="start">EMPRESA</text><rect x="12" y="126" width="200" height="40" rx="8" fill="#FFF7ED" stroke="none"/><text x="28" y="152" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#9A3412" font-weight="600" text-anchor="start">Usuarios y roles</text><rect x="224" y="0" width="856" height="64" rx="14" fill="#FFFFFF" stroke="none"/><line x1="224" y1="64" x2="1080" y2="64" stroke="#E4E4E7" stroke-width="1"/><text x="258" y="40" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#18181B" font-weight="600" text-anchor="start">Empresa La Esquina</text><text x="258" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" fill="#18181B" font-weight="700" text-anchor="start">Crear usuario</text><text x="258" y="140" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#71717A" font-weight="400" text-anchor="start">La cuenta recibirá una contraseña temporal para su primer ingreso.</text><rect x="258" y="173" width="790" height="430" rx="12" fill="#FFFFFF" stroke="#E4E4E7"/><text x="286" y="214" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="600" text-anchor="start">Nombre completo</text><rect x="286" y="222" width="340" height="40" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/><text x="298" y="247" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#18181B" font-weight="400" text-anchor="start"></text><text x="658" y="214" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="600" text-anchor="start">Nombre de usuario</text><rect x="658" y="222" width="362" height="40" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/><text x="670" y="247" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#18181B" font-weight="400" text-anchor="start"></text><text x="286" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="600" text-anchor="start">Correo electrónico</text><rect x="286" y="302" width="340" height="40" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/><text x="298" y="327" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#18181B" font-weight="400" text-anchor="start"></text><text x="658" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="600" text-anchor="start">Rol de trabajador</text><rect x="658" y="302" width="362" height="40" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/><text x="672" y="327" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#71717A" font-weight="400" text-anchor="start">Selecciona un rol</text><text x="1002" y="327" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#71717A" font-weight="600" text-anchor="middle">⌄</text><text x="286" y="390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">La persona usará este rol en todos los módulos.</text><rect x="286" y="421" width="734" height="112" rx="10" fill="#FFF7ED" stroke="#FED7AA"/><text x="310" y="452" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#18181B" font-weight="600" text-anchor="start">Contraseña temporal de un solo uso</text><text x="310" y="478" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">Se generará al crear la cuenta, vence en 24 horas y se mostrará una vez.</text><text x="310" y="501" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">La persona deberá cambiarla al ingresar.</text><rect x="822" y="552" width="198" height="42" rx="8" fill="#F97316" stroke="#F97316"/><text x="921" y="578" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#18181B" font-weight="600" text-anchor="middle">Crear y generar clave</text><text x="258" y="655" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">La cuenta solo tendrá los permisos incluidos en el rol seleccionado.</text></g><g transform="translate(1120 76)"><rect x="0" y="0" width="375" height="820" rx="24" fill="#FFFFFF" stroke="#E4E4E7"/><text x="24" y="47" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#18181B" font-weight="700" text-anchor="start">Stockly</text><text x="24" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" fill="#18181B" font-weight="700" text-anchor="start">Crear usuario</text><text x="24" y="120" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">Asigna una cuenta a un rol de trabajador.</text><text x="24" y="151" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="600" text-anchor="start">Nombre completo</text><rect x="24" y="159" width="327" height="40" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/><text x="36" y="184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#18181B" font-weight="400" text-anchor="start"></text><text x="24" y="225" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="600" text-anchor="start">Nombre de usuario</text><rect x="24" y="233" width="327" height="40" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/><text x="36" y="258" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#18181B" font-weight="400" text-anchor="start"></text><text x="24" y="299" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="600" text-anchor="start">Correo electrónico</text><rect x="24" y="307" width="327" height="40" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/><text x="36" y="332" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#18181B" font-weight="400" text-anchor="start"></text><text x="24" y="375" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="600" text-anchor="start">Rol de trabajador</text><rect x="24" y="383" width="327" height="40" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/><text x="38" y="409" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#71717A" font-weight="400" text-anchor="start">Selecciona un rol</text><text x="336" y="409" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#71717A" font-weight="600" text-anchor="middle">⌄</text><rect x="24" y="447" width="327" height="132" rx="10" fill="#FFF7ED" stroke="#FED7AA"/><text x="42" y="478" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#18181B" font-weight="600" text-anchor="start">Contraseña temporal de un uso</text><text x="42" y="504" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">Se genera al crear la cuenta, vence en</text><text x="42" y="523" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">24 horas y se muestra una vez. El usuario</text><text x="42" y="542" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#71717A" font-weight="400" text-anchor="start">deberá cambiarla al ingresar.</text><rect x="24" y="610" width="327" height="42" rx="8" fill="#F97316" stroke="#F97316"/><text x="187.5" y="636" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#18181B" font-weight="600" text-anchor="middle">Crear y generar clave</text></g></svg>