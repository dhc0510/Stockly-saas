<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5f3;color:#18181b;font:15px/1.5 Inter,system-ui,sans-serif}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1440px;min-height:100dvh;margin:auto;background:white}
aside{padding:24px 16px;background:#faf9f8;border-right:1px solid #e4e4e7}aside strong{font-size:23px}aside p{font-size:12px;color:#52525b;margin:32px 0 6px}
aside span{display:block;padding:10px 12px;border-radius:8px;color:#52525b}aside span.active{background:#fff1e5;color:#9a3412;font-weight:650}

.heading,.actions,.line-add{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.heading{justify-content:space-between;margin-bottom:22px}.heading p{margin-top:6px}.eyebrow{color:#9a3412;font-size:12px;font-weight:700;letter-spacing:.04em}
.panel{border:1px solid #e4e4e7;border-radius:12px;padding:18px;margin-bottom:16px}.panel h2{margin-bottom:12px}.panel .heading{margin-bottom:4px}.panel .heading h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.filters{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);margin-bottom:14px}

label{display:grid;gap:4px;font-weight:600;min-width:0}input,select,button{font:inherit;border:1px solid #a1a1aa;border-radius:8px;min-height:44px;padding:9px 12px;background:white;color:inherit}input,select{width:100%;min-width:0}
button{cursor:pointer;font-weight:650}button:disabled{opacity:.5;cursor:default}.primary{background:#f97316;border-color:#f97316}.danger{background:#b91c1c;color:white;border-color:#b91c1c}.actions{justify-content:flex-end}
.line-add{align-items:start;margin-bottom:14px}.line-add>button{margin-top:26px}
table{width:100%;border-collapse:collapse;text-align:left}th,td{border-bottom:1px solid #e4e4e7;padding:10px 8px;overflow-wrap:anywhere}th{background:#f4f4f5;color:#52525b;font-size:13px}td small{display:block;color:#52525b}td input{max-width:130px}
.quantity{font-variant-numeric:tabular-nums;white-space:nowrap}.up{color:#166534;font-weight:650}.down{color:#991b1b;font-weight:650}
.badge{display:inline-block;border-radius:7px;padding:3px 8px;background:#dcfce7;color:#166534;font-size:13px;white-space:nowrap;width:max-content;align-self:start}.badge.voided,.badge.kind{background:#f4f4f5;color:#3f3f46}
.note,.error,.success{padding:10px 12px;border-radius:8px;margin:10px 0}.note{background:#fff7ed;color:#7c2d12}.error{background:#fef2f2;color:#991b1b}.success{background:#dcfce7;color:#166534}
.line-warning{display:block;color:#991b1b;font-weight:600;white-space:normal}
.flash{animation:mark 1.8s ease-out}@keyframes mark{from{background:#fed7aa}to{background:transparent}}@media(prefers-reduced-motion:reduce){.flash{animation:none;background:#fff1e5}}
[hidden]{display:none!important}:focus-visible{outline:2px solid #9a3412;outline-offset:2px}
dialog{width:min(530px,calc(100% - 24px));border:1px solid #e4e4e7;border-radius:14px;padding:18px}dialog::backdrop{background:#18181b75}dialog form{display:grid;gap:12px}dialog ul{margin:8px 0 0;padding-left:20px}
.mobile-label{display:none}.item-search{position:relative;flex:1;min-width:190px;scroll-margin-top:12px}.item-results{position:absolute;z-index:6;left:0;right:0;top:calc(100% - 20px);max-height:240px;overflow:auto;border:1px solid #d4d4d8;background:white;border-radius:8px;box-shadow:0 8px 20px #18181b1c;padding:4px}.item-results button{display:block;width:100%;text-align:left;border:0;font-weight:400}.item-results button:hover,.item-results button:focus-visible{background:#fff1e5}.item-results small{display:block;color:#52525b}.item-results p{padding:8px}
.quantity-entry{display:grid;grid-template-columns:minmax(80px,115px) auto;gap:3px 8px;align-items:end}.item-unit{padding-bottom:10px}.quantity-entry small{grid-column:1/-1;min-height:1.5em}.entry-date{white-space:nowrap}.reason-detail{grid-column:1/-1}select[aria-invalid="true"]{border-color:#b91c1c}
.skeleton{height:44px;border-radius:8px;background:#f4f4f5;margin:8px 0}.empty{text-align:center;padding:24px 8px}.empty h3{margin:0 0 4px;font-size:16px}
@media(max-width:760px){.shell{display:block}aside{display:none}header{padding:12px 16px}.demo{padding:10px 16px}main{padding:16px}h1{font-size:23px}.heading{align-items:stretch;flex-direction:column}.panel{padding:12px}.grid,.data{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters label:first-child{grid-column:1/-1}.entry-details{grid-template-columns:1fr}.item-search{flex-basis:100%}.line-add>button{margin-left:auto}.heading .actions{display:grid;grid-template-columns:1fr 1fr}.heading .actions button:only-child{grid-column:1/-1}
thead{display:none}table,tbody{display:block}tr{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;border:1px solid #e4e4e7;border-radius:9px;margin:8px 0}td{padding:0;border:0}td:first-child{grid-column:1/-1}.mobile-label{display:block;color:#52525b;font-size:12px}input,select{font-size:16px}.quantity{white-space:normal}
.entry-actions{position:fixed;left:0;right:0;bottom:0;z-index:4;display:grid;grid-template-columns:1fr 1.4fr;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e4e4e7;box-shadow:0 -4px 16px #18181b0d}main:has(.entry-actions){padding-bottom:calc(88px + env(safe-area-inset-bottom))}main:has(input:focus) .entry-actions{visibility:hidden}.entry-date,.data>div:has(.entry-date){grid-column:1/-1}}
</style>
<div class="shell"><aside><strong>Stockly<span style="display:inline;padding:0;background:none;color:#c2410c">.</span></strong><p>INVENTARIO</p><span>Entradas de inventario</span><span class="active">Salidas y ajustes</span></aside>
<div><header><strong>Mi empresa</strong><small>STK-009 · Propuesta visual</small></header>
<section class="demo" aria-label="Controles del mockup"><strong>Solo para revisar el mockup; no forma parte del producto</strong>
<label>Ver como<select id="role"><option value="admin">Administrador de empresa</option><option value="operator">Operar (solo salidas)</option><option value="adjust">Operar + permiso de ajustes</option><option value="void">Operar + permiso de anular</option><option value="read">Solo lectura</option></select></label>
<label>Estado del listado<select id="list-state"><option value="data">Con datos</option><option value="loading">Cargando</option><option value="empty">Sin movimientos</option><option value="error">Error de carga</option></select></label>
<label class="check"><input type="checkbox" id="sim-change"> Otra operación baja 2 el primer artículo al confirmar</label>
<label class="check"><input type="checkbox" id="sim-lost"> Se pierde la respuesta del servidor</label></section>
<main id="main" tabindex="-1"></main></div></div>
<dialog id="dialog" aria-labelledby="dialog-title"><form id="dialog-form"><h2 id="dialog-title"></h2><div id="dialog-content"></div><p id="dialog-error" class="error" role="alert" hidden></p><div class="actions"><button type="button" id="dialog-close">Volver</button><button id="dialog-submit" class="primary">Confirmar</button></div></form></dialog>
<script>
const main=document.querySelector('#main'),dialog=document.querySelector('#dialog'),get=id=>document.getElementById(id);
const items=[
 {id:'CAF-250',name:'Café molido 250 g',barcode:'7441000000250',unit:'unidad'},
 {id:'CAM-M-A',name:'Camiseta básica · M / Azul',barcode:'7441000000083',unit:'unidad'},
 {id:'HAR-001',name:'Harina a granel',barcode:'7441000000014',unit:'kg'}
];
const stock={'CAF-250':18,'CAM-M-A':7,'HAR-001':12.5};
const reasons={OUT:['Daño o rotura','Vencimiento','Robo o faltante','Consumo interno','Otro'],ADJUST:['Conteo físico','Corrección de error','Otro']};
const words={OUT:{name:'salida',title:'Nueva salida',prefix:'SAL',kind:'Salida',plural:'Artículos que salen'},ADJUST:{name:'ajuste',title:'Nuevo ajuste',prefix:'AJU',kind:'Ajuste',plural:'Artículos contados'}};
const records=[
 {id:'SAL-0001',type:'OUT',date:'2026-11-07T15:15:00Z',reason:'Daño o rotura',reference:'',lines:[{id:'CAM-M-A',quantity:1,after:7},{id:'HAR-001',quantity:0.5,after:12.5}]},
 {id:'AJU-0001',type:'ADJUST',date:'2026-11-06T20:40:00Z',reason:'Conteo físico',reference:'Conteo de noviembre',lines:[{id:'CAF-250',before:15,counted:18},{id:'CAM-M-A',before:8,counted:8}]}
];
// Serie ANU compartida: ANU-0001 ya corresponde a una anulación de entrada en este ejemplo.
let voidSequence=1,listSearch='',listType='',listStatus='',current=()=>list(),lostOnce=false;
const item=id=>items.find(value=>value.id===id);
const round=value=>Math.round(value*1000)/1000;
const format=value=>new Intl.NumberFormat('es-CR',{maximumFractionDigits:3}).format(value);
const amount=(value,unit)=>format(value)+' '+(unit==='unidad'&&value!==1?'unidades':unit);
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const normalize=value=>String(value??'').trim().toLocaleLowerCase('es-CR').normalize('NFD').replace(/[̀-ͯ]/g,'');
const label=value=>'<span class="mobile-label">'+value+'</span>';
const dateFormat=new Intl.DateTimeFormat('es-CR',{timeZone:'America/Costa_Rica',day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true});
function dateText(value){const f=Object.fromEntries(dateFormat.formatToParts(new Date(value)).map(p=>[p.type,p.value]));return f.day+' '+f.month.replace(/\.$/,'')+' '+f.year+', '+f.hour+':'+f.minute+' '+(f.dayPeriod.toLowerCase().startsWith('a')?'a. m.':'p. m.');}
function access(){const r=get('role').value;return{out:r!=='read',adjust:r==='admin'||r==='adjust',reverse:r==='admin'||r==='void'};}
function parseQuantity(value){const raw=String(value).trim();return /^\d+(?:[.,]\d+)?$/.test(raw)?Number(raw.replace(',','.')):NaN;}
function quantityError(value,unit,zero){
 const number=parseQuantity(value);
 if(!Number.isFinite(number)||number<0||(!zero&&number===0))return zero?'Ingresa la cantidad contada; puede ser cero. Puedes usar coma decimal.':'Ingresa una cantidad mayor que cero. Puedes usar coma como separador decimal.';
 if(unit==='unidad'&&!Number.isInteger(number))return 'Para unidad solo se aceptan números enteros.';
 if(number>1000000)return 'El máximo por línea es 1.000.000.';
 if((String(value).trim().split(/[.,]/)[1]?.length??0)>3)return 'Ingresa hasta tres decimales.';
 return '';
}
const fresh=()=>({reason:'',otherReason:'',reference:'',lines:[],selected:'',search:'',pendingQuantity:'',warning:'',requestKey:0});
const drafts={OUT:loadDraft('OUT'),ADJUST:loadDraft('ADJUST')};
function loadDraft(type){try{return{...fresh(),...JSON.parse(localStorage.getItem('stockly-stk009-mockup-'+type))};}catch{return fresh();}}
function persist(type){try{localStorage.setItem('stockly-stk009-mockup-'+type,JSON.stringify(drafts[type]));}catch{}}
function clearDraft(type){drafts[type]=fresh();try{localStorage.removeItem('stockly-stk009-mockup-'+type);}catch{}}
const hasDraft=type=>drafts[type].lines.length>0||drafts[type].selected;
function diffText(value,unit){
 if(value===0)return '<span class="muted">Sin diferencia</span>';
 return '<span class="'+(value>0?'up':'down')+'">'+(value>0?'+':'−')+amount(Math.abs(value),unit)+'</span>';
}
function title(name,description,action=''){return '<div class="heading"><div><p class="eyebrow">Inventario / Salidas y ajustes</p><h1>'+name+'</h1><p class="muted">'+description+'</p></div>'+action+'</div>';}
function show(view){current=view;view();scrollTo(0,0);main.focus({preventScroll:true});}
function badge(record){return '<span class="badge '+(record.voided?'voided':'')+'">'+(record.voided?'Anulado':'Confirmado')+'</span>';}
function list(){
 const can=access(),state=get('list-state').value;
 const buttons=[can.out?'<button class="primary" id="new-out">+ Nueva salida</button>':'',can.adjust?'<button id="new-adjust">+ Nuevo ajuste</button>':''].join('');
 main.innerHTML=title('Salidas y ajustes','Registra lo que sale del inventario y corrige el saldo tras un conteo.',buttons?'<div class="actions">'+buttons+'</div>':'')+
 ['OUT','ADJUST'].filter(type=>hasDraft(type)&&(type==='OUT'?can.out:can.adjust)).map(type=>'<p class="note">Tienes un borrador de '+words[type].name+' con '+drafts[type].lines.length+(drafts[type].lines.length===1?' línea':' líneas')+'. <button data-draft="'+type+'">Continuar</button></p>').join('')+
 '<section class="panel"><h2>Movimientos registrados</h2>'+
 (state==='loading'?'<div role="status" aria-label="Cargando movimientos"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>':
  state==='error'?'<p class="error" role="alert">No pudimos cargar los movimientos. Revisa tu conexión e inténtalo de nuevo.</p><div class="actions"><button id="retry">Reintentar</button></div>':
  state==='empty'?'<div class="empty"><h3>Todavía no hay salidas ni ajustes</h3><p class="muted">Cuando registres uno, aparecerá aquí con su comprobante.</p></div>':
 '<div class="grid filters"><label>Buscar<input id="entry-search" type="search" placeholder="Folio o referencia" value="'+esc(listSearch)+'"></label><label>Tipo<select id="entry-type"><option value="">Todos</option><option value="OUT">Salidas</option><option value="ADJUST">Ajustes</option></select></label><label>Estado<select id="entry-status"><option value="">Todos</option><option value="confirmed">Confirmados</option><option value="voided">Anulados</option></select></label></div>'+
 '<table><thead><tr><th>Folio</th><th>Tipo</th><th>Fecha</th><th>Motivo</th><th>Estado</th></tr></thead><tbody id="entry-rows"></tbody></table><p class="muted" id="entry-empty" role="status" hidden>Sin movimientos con estos filtros.</p>')+'</section>';
 get('new-out')&&(get('new-out').onclick=()=>show(()=>edit('OUT')));
 get('new-adjust')&&(get('new-adjust').onclick=()=>show(()=>edit('ADJUST')));
 get('retry')&&(get('retry').onclick=()=>{get('list-state').value='data';list();});
 main.querySelectorAll('[data-draft]').forEach(button=>button.onclick=()=>show(()=>edit(button.dataset.draft)));
 if(state!=='data')return;
 const search=get('entry-search'),type=get('entry-type'),status=get('entry-status');type.value=listType;status.value=listStatus;
 function filter(){
  listSearch=search.value;listType=type.value;listStatus=status.value;
  const term=normalize(listSearch);
  const matches=records.filter(r=>(!term||[r.id,r.reference].some(v=>normalize(v).includes(term)))&&(!listType||r.type===listType)&&(!listStatus||(r.voided?'voided':'confirmed')===listStatus));
  const body=get('entry-rows');
  body.innerHTML=matches.map(r=>'<tr><td><button data-record="'+r.id+'">'+r.id+'</button></td><td>'+label('Tipo')+'<span class="badge kind">'+words[r.type].kind+'</span></td><td class="entry-date">'+label('Fecha')+dateText(r.date)+'</td><td>'+label('Motivo')+esc(r.reason)+'</td><td>'+label('Estado')+badge(r)+'</td></tr>').join('');
  get('entry-empty').hidden=matches.length>0;
  body.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>{const r=records.find(x=>x.id===b.dataset.record);show(()=>receipt(r));});
 }
 search.oninput=filter;type.onchange=filter;status.onchange=filter;filter();
}
function lineResult(type,line){
 const unit=item(line.id).unit,balance=stock[line.id],value=parseQuantity(line.quantity);
 if(type==='OUT'){
  if(!Number.isFinite(value))return amount(balance,unit)+' · cantidad inválida';
  const after=round(balance-value);
  return after<0?'<span class="line-warning">Dejaría saldo negativo. Existencia actual: '+amount(balance,unit)+'.</span>':amount(after,unit);
 }
 return Number.isFinite(value)?diffText(round(value-line.seen),unit):'—';
}
function edit(type,message='',flash=''){
 const draft=drafts[type],w=words[type],zero=type==='ADJUST';
 const rows=draft.lines.map(line=>{
  const unit=item(line.id).unit,field='<input type="text" inputmode="decimal" autocomplete="off" aria-label="'+(zero?'Cantidad contada de ':'Cantidad de ')+line.id+'" data-quantity="'+line.id+'" value="'+esc(String(line.quantity).replace('.',','))+'"> <small>'+unit+'</small>';
  const head='<td><strong>'+item(line.id).name+'</strong><small>'+line.id+'</small></td>';
  return '<tr class="'+(line.id===flash?'flash':'')+'">'+head+(zero?'<td class="quantity">'+label('Saldo en Stockly')+amount(line.seen,unit)+'</td><td>'+label('Contado')+field+'</td><td class="quantity" data-result="'+line.id+'">'+label('Diferencia')+lineResult(type,line)+'</td>':'<td>'+label('Cantidad')+field+'</td><td class="quantity">'+label('Existencia actual')+amount(stock[line.id],unit)+'</td><td class="quantity" data-result="'+line.id+'">'+label('Quedará')+lineResult(type,line)+'</td>')+'<td><button data-remove="'+line.id+'" aria-label="Quitar '+line.id+'">Quitar</button></td></tr>';
 }).join('');
 main.innerHTML=title(w.title,zero?'Escribe lo que contaste. Stockly calcula la diferencia y deja ese saldo al confirmar.':'Revisa las cantidades antes de confirmar. El saldo baja al registrar la salida.','<button type="button" id="back">Volver al listado</button>')+
 (draft.warning?'<div class="error" role="alert">'+draft.warning+'</div>':'')+
 '<section class="panel"><h2>Datos '+(zero?'del ajuste':'de la salida')+'</h2><div class="grid entry-details"><label>Motivo obligatorio<select id="reason" aria-describedby="reason-error"><option value="">Selecciona un motivo</option>'+reasons[type].map(r=>'<option>'+r+'</option>').join('')+'</select><small id="reason-error" class="error" role="alert" hidden>Selecciona el motivo.</small></label><label>Referencia opcional<input id="reference" maxlength="100" value="'+esc(draft.reference)+'" placeholder="'+(zero?'Ej. Conteo de noviembre':'Ej. Reporte de bodega')+'"></label><label class="reason-detail" id="reason-detail">Detalle obligatorio<input id="other-reason" maxlength="150" value="'+esc(draft.otherReason)+'" placeholder="Describe el motivo"></label></div><p class="note"><strong>Ubicación</strong> · Principal</p></section>'+
 '<section class="panel"><h2>'+w.plural+'</h2><form class="line-add" id="add"><div class="item-search"><label>Buscar artículo<input id="item-search" type="search" autocomplete="off" aria-describedby="scan-hint" placeholder="Nombre, SKU o código de barras" value="'+esc(draft.search)+'"></label><small id="scan-hint" class="muted">'+(zero?'Cada lectura del lector suma 1 a lo contado. Para kg, litros o metros, escribe la cantidad.':'Puedes escanear un código y pulsar Enter. Cada lectura suma 1.')+'</small><div id="item-results" class="item-results" hidden></div></div><div class="quantity-entry"><label>'+(zero?'Contado':'Cantidad')+'<input id="quantity" type="text" inputmode="decimal" autocomplete="off" value="'+esc(draft.pendingQuantity)+'"></label><span id="item-unit" class="item-unit"></span><small id="item-stock" class="muted"></small></div><button id="add-line">+ Agregar línea</button></form>'+
 '<p id="line-error" class="error" role="alert" hidden></p><p id="line-message" class="success" role="status" '+(message?'':'hidden')+'>'+esc(message)+'</p>'+
 (draft.lines.length?'<table><thead><tr><th>Artículo</th>'+(zero?'<th>Saldo en Stockly</th><th>Contado</th><th>Diferencia</th>':'<th>Cantidad</th><th>Existencia actual</th><th>Quedará</th>')+'<th>Acción</th></tr></thead><tbody>'+rows+'</tbody></table>':'<p class="muted">Todavía no agregaste artículos.</p>')+
 '</section><div class="actions entry-actions"><button id="discard">Descartar</button><button class="primary" id="review" '+(draft.lines.length||draft.selected||draft.pendingQuantity.trim()?'':'disabled')+'>Revisar '+w.name+'</button></div>';
 const search=get('item-search'),results=get('item-results'),quantity=get('quantity'),reason=get('reason');
 reason.value=reasons[type].includes(draft.reason)?draft.reason:'';
 get('reason-detail').hidden=reason.value!=='Otro';
 const clearFeedback=()=>{get('line-error').hidden=true;get('line-message').hidden=true;};
 function fail(text){get('line-message').hidden=true;const e=get('line-error');e.hidden=false;e.textContent=text;e.scrollIntoView({block:'nearest'});}
 function updateSelection(){
  const chosen=item(draft.selected);
  get('item-unit').textContent=chosen?.unit||'';
  get('item-stock').textContent=chosen?'Existencia actual: '+amount(stock[chosen.id],chosen.unit):'';
  get('add-line').disabled=!chosen;
  get('review').disabled=!draft.lines.length&&!chosen&&!draft.pendingQuantity.trim();
 }
 const matching=()=>{const term=normalize(search.value);return term?items.filter(v=>[v.name,v.id,v.barcode].some(f=>normalize(f).includes(term))):[];};
 function choose(chosen){draft.selected=chosen.id;draft.search=chosen.name+' · '+chosen.id;draft.pendingQuantity='';quantity.value='';search.value=draft.search;results.hidden=true;persist(type);updateSelection();quantity.focus();}
 function showResults(){
  const matches=matching();results.hidden=!normalize(search.value);
  results.innerHTML=matches.length?matches.slice(0,8).map(v=>'<button type="button" data-choose="'+v.id+'"><strong>'+v.name+'</strong><small>'+v.id+' · Existencia: '+amount(stock[v.id],v.unit)+'</small></button>').join(''):'<p class="muted">No encontramos artículos.</p>';
  results.querySelectorAll('[data-choose]').forEach(b=>b.onclick=()=>choose(item(b.dataset.choose)));
 }
 function addLine(id,raw,fromScan=false){
  const unit=item(id).unit,existing=draft.lines.find(l=>l.id===id);
  const error=quantityError(raw,unit,zero)||(existing&&quantityError(existing.quantity,unit,zero));
  if(error){fail(error);return;}
  const added=parseQuantity(raw),total=existing?round(parseQuantity(existing.quantity)+added):added;
  if(total>1000000){fail('El máximo por línea es 1.000.000.');return;}
  if(!existing&&draft.lines.length>=200){fail('Admite hasta 200 líneas.');return;}
  if(existing)existing.quantity=total;else draft.lines.push({id,quantity:total,seen:stock[id]});
  draft.selected='';draft.search='';draft.pendingQuantity='';persist(type);
  edit(type,existing?(added===1?'Se sumó ':'Se sumaron ')+amount(added,unit)+'. Total: '+amount(total,unit)+'.':fromScan?'Artículo agregado por código de barras.':'Artículo agregado.',id);
  get('item-search').focus();
 }
 get('back').onclick=()=>show(list);
 reason.onchange=()=>{reason.removeAttribute('aria-invalid');get('reason-error').hidden=true;draft.reason=reason.value;get('reason-detail').hidden=reason.value!=='Otro';persist(type);clearFeedback();};
 get('other-reason').oninput=e=>{draft.otherReason=e.target.value;persist(type);clearFeedback();};
 get('reference').oninput=e=>{draft.reference=e.target.value;persist(type);};
 quantity.oninput=()=>{draft.pendingQuantity=quantity.value;persist(type);clearFeedback();updateSelection();};
 search.oninput=()=>{draft.selected='';draft.search=search.value;persist(type);clearFeedback();updateSelection();showResults();};
 search.onfocus=()=>{if(!draft.selected)showResults();if(matchMedia('(max-width:760px)').matches)search.closest('.item-search').scrollIntoView({block:'start'});};
 search.onkeydown=event=>{
  if(event.key==='Escape'){results.hidden=true;return;}
  if(event.key==='ArrowDown'&&!results.hidden){event.preventDefault();results.querySelector('button')?.focus();return;}
  if(event.key!=='Enter')return;
  event.preventDefault();
  const term=normalize(search.value),barcode=items.find(v=>normalize(v.barcode)===term);
  if(barcode){if(barcode.unit==='unidad')addLine(barcode.id,'1',true);else choose(barcode);return;}
  if(/^\d+$/.test(term)){results.hidden=true;fail('No encontramos un artículo activo con ese código de barras.');return;}
  const exact=items.find(v=>normalize(v.id)===term),matches=matching();
  if(exact||matches.length===1)choose(exact||matches[0]);else showResults();
 };
 updateSelection();
 main.querySelectorAll('[data-quantity]').forEach(input=>input.oninput=()=>{
  const line=draft.lines.find(l=>l.id===input.dataset.quantity);line.quantity=input.value;persist(type);clearFeedback();
  const cell=main.querySelector('[data-result="'+line.id+'"]');cell.innerHTML=label(zero?'Diferencia':'Quedará')+lineResult(type,line);
 });
 main.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{draft.lines=draft.lines.filter(l=>l.id!==b.dataset.remove);persist(type);edit(type);});
 get('add').onsubmit=e=>{e.preventDefault();if(draft.selected)addLine(draft.selected,quantity.value);};
 get('discard').onclick=()=>modal('Descartar '+w.name,'<p>Se borrará lo escrito en este navegador.</p>','Descartar',()=>{clearDraft(type);show(list);},true);
 get('review').onclick=()=>{
  if(draft.selected||draft.pendingQuantity.trim()){fail('Hay un artículo sin agregar. Agrégalo o limpia el artículo y la cantidad antes de revisar.');return;}
  if(!reasons[type].includes(draft.reason)){clearFeedback();get('reason-error').hidden=false;reason.setAttribute('aria-invalid','true');reason.focus();return;}
  if(draft.reason==='Otro'&&!draft.otherReason.trim()){fail('Escribe el detalle del motivo Otro.');get('other-reason').focus();return;}
  for(const line of draft.lines){
   const error=quantityError(line.quantity,item(line.id).unit,zero);
   if(error){fail(item(line.id).name+': '+error);return;}
   if(!zero&&parseQuantity(line.quantity)>stock[line.id]){fail(item(line.id).name+': la salida dejaría saldo negativo. Existencia actual: '+amount(stock[line.id],item(line.id).unit)+'.');return;}
  }
  const summary=draft.lines.map(line=>{
   const unit=item(line.id).unit,value=parseQuantity(line.quantity);
   return '<li>'+item(line.id).name+' · '+(zero?amount(line.seen,unit)+' → '+amount(value,unit)+' ('+diffText(round(value-line.seen),unit)+')':'−'+amount(value,unit))+'</li>';
  }).join('');
  modal('Confirmar '+w.name,'<p>'+(zero?'El saldo de estos artículos en <strong>Principal</strong> quedará igual a lo contado.':'Se registrará una salida de <strong>Principal</strong> con '+draft.lines.length+(draft.lines.length===1?' línea.':' líneas.'))+'</p><ul>'+summary+'</ul>','Confirmar '+w.name,()=>confirm(type));
 };
}
function confirm(type){
 const draft=drafts[type],zero=type==='ADJUST';
 if(get('sim-lost').checked&&!lostOnce){lostOnce=true;throw Error('No recibimos respuesta del servidor. Tus datos se conservan. Pulsa de nuevo para reintentar: no se duplicará.');}
 lostOnce=false;
 if(get('sim-change').checked){const first=draft.lines[0];stock[first.id]=Math.max(0,round(stock[first.id]-2));get('sim-change').checked=false;}
 if(zero){
  const changed=draft.lines.filter(l=>l.seen!==stock[l.id]);
  if(changed.length){
   draft.warning='<strong>El saldo cambió y no se aplicó el ajuste.</strong> Otra operación modificó estos artículos después de tu conteo. Revisa la nueva diferencia y confirma otra vez:<ul>'+changed.map(l=>{const u=item(l.id).unit;return '<li>'+item(l.id).name+': saldo '+amount(l.seen,u)+' → '+amount(stock[l.id],u)+'. Nueva diferencia: '+diffText(round(parseQuantity(l.quantity)-stock[l.id]),u)+'</li>';}).join('')+'</ul>';
   changed.forEach(l=>l.seen=stock[l.id]);persist(type);show(()=>edit(type));return;
  }
 } else {
  const short=draft.lines.filter(l=>parseQuantity(l.quantity)>stock[l.id]);
  if(short.length){draft.warning='<strong>No se registró la salida.</strong> Otra operación cambió el saldo y estas líneas dejarían existencias negativas: '+short.map(l=>esc(item(l.id).name)+' (existencia: '+amount(stock[l.id],item(l.id).unit)+')').join(', ')+'.';persist(type);show(()=>edit(type));return;}
 }
 const count=records.filter(r=>r.type===type).length+1;
 const record={id:words[type].prefix+'-'+String(count).padStart(4,'0'),type,date:new Date().toISOString(),reason:draft.reason==='Otro'?'Otro · '+draft.otherReason.trim():draft.reason,reference:draft.reference,lines:draft.lines.map(l=>{
  const value=parseQuantity(l.quantity);
  if(zero){const before=stock[l.id];stock[l.id]=value;return{id:l.id,before,counted:value};}
  stock[l.id]=round(stock[l.id]-value);return{id:l.id,quantity:value,after:stock[l.id]};
 })};
 records.unshift(record);clearDraft(type);show(()=>receipt(record,words[type].kind+' confirmad'+(zero?'o':'a')+'.'));
}
function receipt(record,message=''){
 const zero=record.type==='ADJUST',can=access();
 main.innerHTML=title('Comprobante '+record.id,'Registro interno '+(zero?'del ajuste':'de la salida')+' de inventario.','<button type="button" id="back">Volver al listado</button>')+
 (message?'<p class="success" role="status">'+esc(message)+'</p>':'')+
 '<section class="panel"><div class="heading"><h2>Detalle '+(zero?'del ajuste':'de la salida')+'</h2>'+badge(record)+'</div><dl class="data">'+[['Tipo',words[record.type].kind],['Ubicación','Principal'],['Fecha y hora',dateText(record.date)],['Responsable','Administrador de prueba'],['Motivo',record.reason],['Referencia',record.reference||'—']].map(([n,v])=>'<div><dt>'+n+'</dt><dd'+(n==='Fecha y hora'?' class="entry-date"':'')+'>'+esc(v)+'</dd></div>').join('')+'</dl>'+
 (record.voided?'<p class="note"><strong>Movimiento inverso '+record.voided.id+'</strong> · '+esc(record.voided.reason)+'</p>':'')+'</section>'+
 '<section class="panel"><h2>'+(zero?'Resultado del conteo':'Existencias tras la salida')+'</h2><p class="muted">Saldo registrado al confirmar; no cambia con movimientos posteriores.</p><table><thead><tr><th>Artículo</th>'+(zero?'<th>Saldo antes</th><th>Contado</th><th>Diferencia</th>':'<th>Cantidad retirada</th><th>Existencia después</th>')+'</tr></thead><tbody>'+
 record.lines.map(l=>{const u=item(l.id).unit,head='<td><strong>'+item(l.id).name+'</strong><small>'+l.id+'</small></td>';
  return '<tr>'+head+(zero?'<td class="quantity">'+label('Saldo antes')+amount(l.before,u)+'</td><td class="quantity">'+label('Contado')+'<strong>'+amount(l.counted,u)+'</strong></td><td class="quantity">'+label('Diferencia')+diffText(round(l.counted-l.before),u)+'</td>':'<td class="quantity">'+label('Retirado')+'−'+amount(l.quantity,u)+'</td><td class="quantity">'+label('Existencia después')+'<strong>'+amount(l.after,u)+'</strong></td>')+'</tr>';}).join('')+'</tbody></table></section>'+
 '<div class="actions">'+(record.voided?'':can.reverse?'<button id="cancel">Anular '+(zero?'ajuste':'salida')+'</button>':'<p class="muted">Necesitas el permiso «Anular salidas y ajustes» para anular este movimiento.</p>')+'</div>';
 get('back').onclick=()=>show(list);
 const cancel=get('cancel');
 if(cancel)cancel.onclick=()=>modal('Anular '+record.id,'<label>Motivo de anulación obligatorio<input id="cancel-reason" maxlength="150"></label><p class="note">Se anula completo y una sola vez. Stockly registrará un movimiento inverso vinculado a este comprobante.</p>','Confirmar anulación',()=>{
  const reason=get('cancel-reason').value.trim();
  if(!reason)throw Error('Escribe el motivo de la anulación.');
  const delta=l=>zero?-round(l.counted-l.before):l.quantity;
  const bad=record.lines.find(l=>round(stock[l.id]+delta(l))<0);
  if(bad)throw Error('No se anuló nada: la anulación dejaría existencias negativas para '+item(bad.id).name+'.');
  record.lines.forEach(l=>{stock[l.id]=round(stock[l.id]+delta(l));});
  record.voided={id:'ANU-'+String(++voidSequence).padStart(4,'0'),reason};
  show(()=>receipt(record,'Movimiento anulado. Se registró el movimiento inverso.'));
 },true);
}
function modal(titleText,content,action,run,danger=false){
 get('dialog-title').textContent=titleText;get('dialog-content').innerHTML=content;
 const error=get('dialog-error');error.hidden=true;
 const submit=get('dialog-submit');submit.textContent=action;submit.className=danger?'danger':'primary';
 get('dialog-form').onsubmit=e=>{e.preventDefault();try{run();dialog.close();}catch(f){error.hidden=false;error.textContent=f.message;}};
 dialog.showModal();
}
get('dialog-close').onclick=()=>dialog.close();
get('role').onchange=()=>show(list);
get('list-state').onchange=()=>show(list);
list();
</script>
</html>
